# Tests every pull request. On dev, tests then deploys the dev site (D47) and the website's
# preview (D63); on main, tests then deploys the live site and the website (D63). Each deploy
# checks its site is serving the new build. Needs one repository secret, CLOUDFLARE_API_TOKEN (the account ID is in
# wrangler.jsonc).
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    # 0.62.1: the browser tests take 15-20 minutes on a GitHub runner since D72; 20 cut a passing run off.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: .playwright/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer push waits rather than racing.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://green-tracker.green-tracker.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Build, migrate, deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Live site serves this build
        run: |
          want="$(node -p 'require("./package.json").version')+$(git rev-parse --short HEAD)"
          for i in $(seq 1 12); do
            got=$(curl -fsS https://green-tracker.green-tracker.workers.dev/api/health || true)
            echo "$got"
            echo "$got" | grep -q '"ok":true' && echo "$got" | grep -qF "\"$want\"" && exit 0
            sleep 5
          done
          echo "::error::The live site isn't serving $want"
          exit 1
      # The website (D63): files only. version.txt is written here, so the check below can tell
      # this build from the last one.
      - name: Deploy the website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "$(node -p 'require("./package.json").version')+$(git rev-parse --short HEAD)" > site/public/version.txt
          npm run deploy:site
      - name: Website serves this build
        run: |
          want="$(cat site/public/version.txt)"
          for i in $(seq 1 12); do
            got=$(curl -fsS https://green-tracker-site.green-tracker.workers.dev/version.txt || true)
            echo "$got"
            [ "$got" = "$want" ] && exit 0
            sleep 5
          done
          echo "::error::The website isn't serving $want"
          exit 1

  # The dev site (D47). Only the owner can open it (a Cloudflare Access email lock), so there's
  # no check from outside here: the deploy step itself fails if the new build doesn't go out.
  deploy-dev:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    environment:
      name: dev
      url: https://green-tracker-dev.green-tracker.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Build, migrate, deploy the dev site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:dev
      # The website's preview (D63), locked like the dev site.
      - name: Deploy the website preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "$(node -p 'require("./package.json").version')+$(git rev-parse --short HEAD)" > site/public/version.txt
          npm run deploy:site:dev
