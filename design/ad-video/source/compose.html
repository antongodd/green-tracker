<!-- Every frame is a pure function of time: window.render(t) draws the moment t (seconds) and resolves when its
     pictures are decoded. ?v=1 is the upright cut (1080×1920); without it, widescreen (1920×1080). -->
<style>
:root { --bg: #03070a; --text: #f1f6f3; --green: #58e08c; --teal: #40c4c4; --violet: #8b7bff; --grad: linear-gradient(100deg, #9dffc4, #58e08c 45%, #40c4c4); }
* { box-sizing: border-box; margin: 0; padding: 0; }

#head .w { display: inline-block; white-space: pre; will-change: transform; }
#head .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .12em; margin-bottom: -.12em; }
.v #cap { left: 60px; right: 60px; top: 92px; text-align: center; }
.v #head { font-size: 86px; line-height: .98; }
.h #cap { left: 150px; width: 860px; top: 0; height: 1080px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.h #head { font-size: 112px; line-height: .96; }
.h #kick { font-size: 28px; }
/* The phone. Everything inside is laid out at 393×852 (an iPhone) and scaled up. */
#rig { position: absolute; left: 0; top: 0; width: 393px; height: 852px; transform-origin: 0 0; z-index: 3; }

.gcard .ph { height: 150px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 55%, rgba(88, 224, 140, .28), transparent 65%); }

#chat .bar { position: absolute; left: 12px; right: 12px; bottom: 34px; height: 42px; border-radius: 21px; border: 1px solid rgba(255, 255, 255, .14); font: 500 16px/40px "Inter"; padding-left: 18px; color: rgba(241, 246, 243, .35); }
/* The app's icon opening. */
#splash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, #0b2a1b, #03070a 70%); display: flex; align-items: center; justify-content: center; }

/* Snap it: the photo, then the cut-out (drawn for the video from the app's own cut-out of this photo). */
#snap { position: absolute; inset: 0; background: #05090c; }
#snap .frame { position: absolute; left: 0; top: 150px; width: 393px; height: 393px; overflow: hidden; }

#snap .lbl { position: absolute; left: 0; right: 0; top: 86px; text-align: center; font: 700 17px/1 "Inter"; }

#end .ic { width: 190px; height: 190px; border-radius: 44px; box-shadow: 0 0 110px rgba(88, 224, 140, .55), 0 26px 50px rgba(0, 0, 0, .5); }
#end h1 { font: 800 104px/1 "Inter Display"; letter-spacing: -.04em; margin-top: 44px; }

#end h2 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .12em; }
#end .chips { display: flex; gap: 14px; margin-top: 46px; flex-wrap: wrap; justify-content: center; }

.h #end .ic { width: 150px; height: 150px; border-radius: 36px; }

.h #end h2 { font-size: 54px; margin-top: 18px; }
.h #end .chips { margin-top: 34px; } .h #end .cta { margin-top: 38px; padding: 24px 50px; font-size: 38px; } .h #end .bio { margin-top: 20px; }
.v #end .ic { width: 250px; height: 250px; border-radius: 58px; }
.v #end h1 { font-size: 128px; margin-top: 56px; }
.v #end h2 { font-size: 74px; margin-top: 30px; }
.v #end .chips { gap: 16px; margin-top: 60px; padding: 0 40px; } .v #end .chips i { font-size: 34px; padding: 18px 28px; }
.v #end .cta { font-size: 54px; padding: 36px 72px; margin-top: 70px; } .v #end .bio { font-size: 36px; margin-top: 34px; }
.nug { position: absolute; z-index: 4; filter: drop-shadow(0 20px 30px rgba(0, 0, 0, .55)); will-change: transform; }
</style>

        <svg width="78" height="14" viewBox="0 0 78 14" fill="currentColor"><rect x="0" y="9" width="3.4" height="4" rx="1"/><rect x="5" y="6.5" width="3.4" height="6.5" rx="1"/><rect x="10" y="3.5" width="3.4" height="9.5" rx="1"/><rect x="15" y="0.5" width="3.4" height="12.5" rx="1"/><path d="M33 2.2c2.6 0 5 1 6.8 2.7l-1.3 1.4A8 8 0 0 0 33 4.1a8 8 0 0 0-5.5 2.2l-1.3-1.4A9.9 9.9 0 0 1 33 2.2zm0 3.7c1.6 0 3.1.6 4.200 1.700l-1.300 1.400a4.200 4.200 0 0 0-5.800 0l-1.300-1.400a6.100 6.100 0 0 1 4.200-1.700zm0 3.700c.7 0 1.300.300 1.800.700L33 12.600l-1.800-2.300c.5-.4 1.100-.7 1.800-.7z"/><rect x="47.500" y="1" width="25" height="12" rx="3.800" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="49.300" y="2.800" width="21.400" height="8.400" rx="2.300"/><rect x="74" y="4.800" width="1.800" height="4.400" rx=".9" fill-opacity=".45"/></svg>

<script src="tl.js"></script>
<script>
const Q = new URLSearchParams(location.search);
const V = Q.has('v');
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
document.documentElement.style.width = document.body.style.width = W + 'px';
document.body.style.height = H + 'px';
document.body.className = V ? 'v' : 'h';
const $ = (id) => document.getElementById(id);
const stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';
const { S, BEAT } = TL;
// Where the phone rests.
const K = V ? 690 / 393 : 930 / 852;                 // how much the 393×852 screen is enlarged
const PX = V ? (1080 - 393 * K) / 2 : 1245, PY = V ? 392 : (1080 - 852 * K) / 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eo = (t) => 1 - Math.pow(1 - clamp(t), 3);
const eio = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = (t) => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const prog = (f, a, b) => clamp((f - a) / (b - a));
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---- what was filmed
const SHOTS = ['home', 'editor', 'board', 'strainz', 'sources', 'post', 'mates1', 'mates2', 'private1', 'private2', ...TL.looks.map((l) => 'look-' + l)];
const META = {};
window.ready = (async () => {
  for (const s of SHOTS) META[s] = await (await fetch(`film/${s}.json`)).json();
  await document.fonts.load('800 80px "Inter Display"'); await document.fonts.load('600 17px "Inter"'); await document.fonts.load('800 17px "Inter"'); await document.fonts.load('500 17px "Inter"'); await document.fonts.load('700 17px "Inter"');
  await document.fonts.ready;
  await Promise.all([...document.images].filter((i) => i.getAttribute('src')).map((i) => i.decode().catch(() => {})));
})();
const src = (shot, f) => `film/${shot}/${String(f).padStart(4, '0')}.jpg`;
const pending = [];
function setImg(el, url) {
  if (el.dataset.u === url) return;
  el.dataset.u = url; el.src = url;
  pending.push(el.decode().catch(() => {}));
}

// ---- background
const stars = $('stars');
for (let i = 0; i < 46; i++) { const s = document.createElement('i'); s.style.left = rnd(i) * 100 + '%'; s.style.top = rnd(i + 99) * 100 + '%'; s.dataset.i = i; stars.appendChild(s); }
const PAL = {
  aurora: ['#1f9d5a', '#1b6f8a', '#4c3fb0'], sakura: ['#c2487f', '#7a3fa8', '#e58fb8'], deepsea: ['#0e6f9d', '#0d3f8a', '#1fb5a8'],
  lava: ['#c2531c', '#a81f3f', '#e09a1f'], outrun: ['#a11fc2', '#3f2fd0', '#ff3fa0'], daysky: ['#5aa8e0', '#e0a85a', '#8fd0ff'], chat: ['#23323a', '#1b2a3a', '#2a2440'],
};
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; };
function drawBg(F, palA, palB, pt, pulse) {
  const t = F / 30;
  const R = Math.max(W, H);
  [['b1', .52, .1, .21, .17, 1.05], ['b2', .1, .62, .16, .23, .95], ['b3', .85, .78, .19, .13, .85]].forEach(([id, x, y, sx, sy, sz], i) => {
    const e = $(id); const size = R * sz * (1 + pulse * .04);
    e.style.width = e.style.height = size + 'px';
    e.style.background = `radial-gradient(circle closest-side, ${mix(PAL[palA][i], PAL[palB][i], pt)} 0%, transparent 100%)`;
    e.style.opacity = .5 + pulse * .1;
    e.style.transform = `translate(${W * x - size / 2 + Math.sin(t * sx + i * 2) * W * .12}px, ${H * y - size / 2 + Math.cos(t * sy + i) * H * .08}px)`;
  });
  for (const s of stars.children) { const i = +s.dataset.i; s.style.opacity = .12 + .3 * (.5 + .5 * Math.sin(t * (.6 + rnd(i + 7)) + i)); }
}

// ---- captions: [from frame, to frame, kicker, headline]; *word = in the gradient
const CAPS = [
  [S.chat.at + 84, S.chat.end - 4, '', 'Every sesh. *Same *question.'],
  [S.reveal.at + 6, S.reveal.end - 4, 'Green Tracker', 'Remember *the *fire.'],
  [S.snap.at + 4, S.snap.end - 4, 'Snap it', 'Snap your bud. *We *cut *it *out.'],
  [S.rate.at + 4, S.rate.at + 236, 'Rate it', 'Rate it while *it’s *fresh.'],
  [S.rate.at + 242, S.rate.end - 4, 'Rate it', '9.5. *Certified *gas.'],
  [S.rank.at + 4, S.rank.end - 4, 'Rank it', 'Your top shelf, *sorted.'],
  [S.strainz.at + 4, S.strainz.end - 4, 'Strainz', 'Every strain *you’ve *ever *had.'],
  [S.sources.at + 4, S.sources.end - 4, 'Sources', 'Know your plug. *Know *your *spend.'],
  [S.post.at + 4, S.post.end - 4, 'Post it', 'Show your mates *the *gas.'],
  [S.mates.at + 4, S.mates.end - 4, 'Your mates', 'See who’s *had *what.'],
  [S.private.at + 4, S.private.end - 4, 'Private', 'Only the mates *you *approve.'],
  [S.looks.at + 4, S.looks.end - 4, 'Looks', 'Your stash. *Your *look.'],
  [S.answer.at + 44, S.answer.end - 4, '', 'Now you *just *know.'],
];
let capKey = '';
function drawCap(F) {
  const c = CAPS.find((c) => F >= c[0] && F < c[1]);
  const cap = $('cap');
  if (!c) { cap.style.opacity = 0; return; }
  cap.style.opacity = 1;
  const key = c[0] + c[3];
  if (key !== capKey) {
    capKey = key;
    $('kick').textContent = c[2]; $('kick').style.display = c[2] ? 'inline-block' : 'none';
    $('head').innerHTML = c[3].split(' ').map((w) => (w === '/' ? '<br>' : `<span class="w${w[0] === '*' ? ' g' : ''}">${w.replace('*', '')} </span>`)).join('');
  }
  const L = F - c[0], out = prog(F, c[1] - 7, c[1]);
  const k = $('kick'); const kp = eo(L / 9);
  k.style.opacity = kp * (1 - out); k.style.transform = `translateY(${(1 - kp) * 18 - out * 14}px)`;
  [...$('head').children].forEach((w, i) => {
    if (w.tagName === 'BR') return;
    const p = eo((L - 3 - i * 2.2) / 11);
    w.style.opacity = p * (1 - out);
    w.style.transform = `translateY(${(1 - p) * 46 - out * 18}px)`;
  });
}

// ---- the chat
const AV = { jay: 'nugs/av-jay.jpg', mira: 'nugs/av-mira.jpg', kofi: 'nugs/av-kofi.jpg' };
const NAME = { jay: 'Jay', mira: 'Mira', kofi: 'Kofi' };
const msgs = $('msgs');
function buildChat(list) {
  msgs.innerHTML = '';
  let prev = null;
  list.forEach((m, i) => {
    const d = document.createElement('div'); d.className = 'msg' + (m.who === 'me' ? ' me' : '');
    const inner = m.card
      ? `<div class="gcard"><div class="ph"><img src="nugs/zkittlez.png"></div><div class="row"><div><b>Zkittlez</b><small>#1 on my Leaderboard</small></div><em>9.5</em></div></div>`
      : `<div class="bub">${m.text}</div>`;
    d.innerHTML = (m.who === 'me' ? '' : `<img class="av" src="${AV[m.who]}">`) + `<div class="col">${m.who !== 'me' && prev !== m.who ? `<div class="nm">${NAME[m.who]}</div>` : ''}${inner}</div>`;
    msgs.appendChild(d); prev = m.who;
  });
  // the typing dots (shown before a friend's message)
  const t = document.createElement('div'); t.className = 'msg'; t.id = 'typing'; t.innerHTML = `<img class="av" id="tav"><div class="dots"><i></i><i></i><i></i></div>`;
  msgs.appendChild(t);
}
let chatKey = '';
function drawChat(L, list, key, pre = []) {
  if (chatKey !== key) { chatKey = key; buildChat([...pre, ...list]); }
  const all = [...pre.map((m) => ({ ...m, f: -999 })), ...list];
  const els = [...msgs.children].filter((e) => e.id !== 'typing');
  const hs = els.map((e) => e.offsetHeight);
  // each message's resting y, with the list pushed up when it gets long
  let y = 0; const ys = [];
  all.forEach((m, i) => { const gap = i && all[i - 1].who === m.who ? 6 : 16; y += i ? gap : 0; ys.push(y); y += hs[i]; });
  let shown = 0; all.forEach((m, i) => { const p = back(prog(L, m.f, m.f + 9)); if (L >= m.f) shown = Math.max(shown, ys[i] + hs[i] * Math.min(1, p)); });
  const typing = list.find((m) => m.who !== 'me' && L >= m.f - 22 && L < m.f);
  const tEl = $('typing');
  const room = 852 - 124 - 100;
  let need = shown + (typing ? 62 : 0);
  const shift = Math.max(0, need - room);
  all.forEach((m, i) => {
    const e = els[i];
    const p = prog(L, m.f, m.f + 9), b = back(p);
    e.style.opacity = L >= m.f ? clamp(p * 2.5) : 0;
    e.style.transformOrigin = m.who === 'me' ? '100% 100%' : '0 100%';
    e.style.transform = `translateY(${ys[i] - shift + (1 - eo(p)) * 22}px) scale(${.82 + .18 * b})`;
  });
  if (typing) {
    const i = all.indexOf(typing);
    $('tav').src = AV[typing.who];
    tEl.style.opacity = clamp((L - (typing.f - 22)) / 4);
    tEl.style.transform = `translateY(${ys[i] - shift}px)`;
    [...tEl.querySelectorAll('i')].forEach((d, k) => { d.style.transform = `translateY(${-4 * Math.max(0, Math.sin((L / 4.5) - k * .9))}px)`; });
  } else tEl.style.opacity = 0;
}

// ---- the phone's screen
const imA = $('imA'), imB = $('imB');
function layers(a, b) {
  for (const [el, l] of [[imA, a], [imB, b]]) {
    if (!l) { el.style.display = 'none'; continue; }
    el.style.display = 'block'; setImg(el, src(l.shot, l.f));
    el.style.opacity = l.o ?? 1;
    el.style.transform = `translateX(${l.x ?? 0}px) scale(${l.s ?? 1})`;
    el.style.filter = l.dim ? `brightness(${1 - l.dim})` : '';
    el.style.boxShadow = l.sh ? '-20px 0 50px rgba(0,0,0,.6)' : '';
  }
}
// A filmed shot at frame f. `push`: frames where the app opened a new page (it slides in, as on the phone);
// `pop`: frames where a page was replaced (the new one fades up).
function film(shot, f, { push = [], pop = [] } = {}) {
  for (const m of push) if (f >= m && f < m + 13) { const e = eo((f - m + 1) / 13); return layers({ shot, f, x: 393 * (1 - e), sh: true }, { shot, f: m - 1, x: -110 * e, dim: .45 * e }); }
  for (const m of pop) if (f >= m && f < m + 10) { const p = (f - m + 1) / 10, e = eo(clamp((p - .25) / .75)); return layers({ shot, f, o: e, s: 1.04 - .04 * e }, { shot, f: m - 1, dim: Math.min(.9, p * 4) }); }
  layers({ shot, f }, null);
}
function finger(shot, f) {
  const fr = META[shot].frames, g = fr[f];
  const el = $('finger'), rp = $('ripple');
  if (!g) { el.style.display = 'none'; } else {
    // fade in over its first frames on screen
    let age = 0; while (age < 6 && fr[f - age - 1]) age++;
    el.style.display = 'block'; el.style.left = g.x + 'px'; el.style.top = g.y + 'px';
    el.style.opacity = clamp((age + 1) / 5);
    el.style.transform = `scale(${g.down ? .78 : 1})`;
    el.style.background = g.down ? 'rgba(157,255,196,.5)' : 'rgba(255,255,255,.3)';
  }
  // a ripple from each press
  rp.style.display = 'none';
  for (let a = 0; a < 12 && f - a >= 0; a++) {
    const now = fr[f - a], before = fr[f - a - 1];
    if (now && now.down && !(before && before.down)) { const p = (a + 1) / 12; rp.style.display = 'block'; rp.style.left = now.x + 'px'; rp.style.top = now.y + 'px'; rp.style.opacity = 1 - p; rp.style.transform = `scale(${1 + eo(p) * 1.9})`; break; }
  }
}
function ring(rect, p, label, pad = 6) {
  const r = $('ring'), t = $('tag');
  if (!rect || p <= 0) { r.style.display = t.style.display = 'none'; return; }
  const e = back(clamp(p * 3)), o = clamp(p * 4) * clamp((1 - p) * 5);
  r.style.display = 'block'; r.style.left = rect.x - pad + 'px'; r.style.top = rect.y - pad + 'px'; r.style.width = rect.w + pad * 2 + 'px'; r.style.height = rect.h + pad * 2 + 'px';
  r.style.opacity = o; r.style.transform = `scale(${1.1 - .1 * e})`; r.style.borderRadius = Math.min(26, (rect.h + pad * 2) / 2) + 'px';
  if (label) { t.style.display = 'block'; t.textContent = label; t.style.left = rect.x + rect.w - 96 + 'px'; t.style.top = rect.y - 22 + 'px'; t.style.opacity = o; t.style.transform = `scale(${.6 + .4 * e}) rotate(4deg)`; } else t.style.display = 'none';
}
const only = (id) => { for (const k of ['splash', 'chat', 'snap']) $(k).style.display = k === id ? '' : 'none'; };

// ---- scenes: each draws its local frame L and returns the camera { s: zoom, fy, fx } and options
const cam0 = { s: 1 };
const SC = {
  chat(L) {
    only('chat'); layers(null, null); drawChat(L, TL.chat, 'q');
    return { s: lerp(V ? 1.42 : 1.14, 1, eio(prog(L, 30, 84))), fy: V ? 235 : 420, bg: 'chat' };
  },
  reveal(L) {
    // the chat fades into the icon; the icon opens into the app
    if (L < 34) {
      only('splash');
      $('splash').style.opacity = 1;
      const p = back(prog(L, 2, 16));
      const z = eio(prog(L, 22, 34));
      $('splash').firstElementChild.style.transform = `scale(${(.3 + .7 * p) * (1 + z * 7)})`;
      $('splash').firstElementChild.style.opacity = clamp(L / 4) * (1 - z);
      layers({ shot: 'home', f: 0, o: z, s: 1.12 - .12 * z }, null);
      return { s: 1, bg: L < 6 ? 'chat' : 'aurora', bgt: prog(L, 0, 12), from: 'chat' };
    }
    only(null); layers({ shot: 'home', f: Math.min(99, L - 34) }, null);
    return { s: lerp(1, 1.035, prog(L, 34, 80)) };
  },
  snap(L) {
    const flyAt = 112;
    only('snap');
    $('flash').style.opacity = L < 9 ? 1 - eo(L / 9) : 0;
    const sp = eio(prog(L, 34, 82));               // the scan, top to bottom
    $('cutwrap').style.height = 393 * sp + 'px';
    const scan = $('scan'); scan.style.top = 393 * sp - 2 + 'px'; scan.style.opacity = sp > 0 && sp < 1 ? 1 : 0;
    const pill = $('pill');
    pill.textContent = L < 30 ? 'Remove background' : sp < 1 ? 'Finding the bud…' : '✓ Cut out';
    pill.style.opacity = clamp(L / 8) * (1 - prog(L, flyAt - 4, flyAt + 4));
    pill.style.transform = `translateX(-50%) scale(${sp >= 1 ? .9 + .1 * back(prog(L, 82, 92)) : 1})`;
    // sparkles as the cut-out lands
    const sk = $('sparks'); if (!sk.children.length) for (let i = 0; i < 14; i++) { const s = document.createElement('i'); s.className = 'spark'; sk.appendChild(s); }
    [...sk.children].forEach((s, i) => { const p = prog(L, 82, 104); const a = rnd(i) * 6.283, r = 60 + rnd(i + 5) * 170; s.style.left = 196 + Math.cos(a) * r * eo(p) + 'px'; s.style.top = 346 + Math.sin(a) * r * eo(p) + 'px'; s.style.opacity = p > 0 && p < 1 ? (1 - p) : 0; s.style.transform = `scale(${1.3 - p})`; });
    // then it flies into the new product's photo slot, and the form fades up under it
    const fp = eio(prog(L, flyAt, flyAt + 26));
    const fly = $('fly');
    const pop = 1 + .06 * Math.sin(prog(L, 82, 96) * Math.PI);
    const a = { x: 43, y: 193, w: 307 }, b = { x: 41, y: 295, w: 88 };
    const fw = lerp(a.w, b.w, fp) * (fp ? 1 : pop);
    fly.style.display = L >= 82 ? 'block' : 'none';
    fly.style.width = fw + 'px'; fly.style.left = lerp(a.x, b.x, fp) - (fp ? 0 : (fw - a.w) / 2) + 'px'; fly.style.top = lerp(a.y, b.y, fp) - (fp ? Math.sin(fp * Math.PI) * 60 : (fw - a.w) / 2) + 'px';
    fly.style.opacity = 1 - prog(L, flyAt + 30, flyAt + 36);
    $('cutwrap').lastElementChild.style.visibility = L >= 82 ? 'hidden' : 'visible';
    $('snap').style.opacity = 1 - eo(prog(L, flyAt, flyAt + 9));
    layers({ shot: 'editor', f: 15 }, null);
    return { s: lerp(1.0, 1.06, eio(prog(L, 20, 90))) - .06 * eio(prog(L, flyAt, flyAt + 24)), fy: 300 };
  },
  rate(L) {
    only(null); const m = TL.map.rate(L); film(m.shot, m.f, { pop: [META.editor.marks.saved] }); finger(m.shot, m.f);
    const z = eio(prog(L, 80, 100)) - eio(prog(L, 222, 238));
    if (L >= 240) return { s: lerp(1.0, 1.06, prog(L, 240, 320)), bump: L - 240, fy: 380 };
    return { s: 1 + .13 * z, fy: 60 };
  },
  rank(L) {
    only(null); const m = TL.map.rank(L); film(m.shot, m.f); finger(m.shot, m.f);
    ring(META.board.marks.row1, prog(L, 10, 74), 'New #1');
    return { s: 1 + .12 * (1 - eio(prog(L, 58, 82))), fy: 120 };
  },
  strainz(L) {
    only(null); const m = TL.map.strainz(L); film(m.shot, m.f, { push: [META.strainz.marks.page] }); finger(m.shot, m.f);
    return { s: 1 + .04 * prog(L, 0, 100) * (L < 100 ? 1 : 0) + (L >= 100 ? .03 * prog(L, 100, 240) : 0) };
  },
  sources(L) {
    only(null); const m = TL.map.sources(L); film(m.shot, m.f, { push: [META.sources.marks.page] }); finger(m.shot, m.f);
    const st = META.sources.marks.stats;
    ring(L >= 116 ? { x: st.x - 70, y: st.y - 4, w: st.w + 78, h: st.h + 8 } : null, prog(L, 116, 196), null, 5);
    return { s: 1 + (L >= 100 ? .1 * eio(prog(L, 108, 126)) : .03 * prog(L, 0, 100)), fy: 40 };
  },
  post(L) {
    only(null); const m = TL.map.post(L); film(m.shot, m.f, { pop: [META.post.marks.feed, META.post.marks.react] }); finger(m.shot, m.f);
    return { s: 1 + (L >= 100 ? .03 * prog(L, 100, 240) : 0), bump: L >= 100 ? L - 100 : undefined };
  },
  mates(L) {
    only(null); const m = TL.map.mates(L); film(m.shot, m.f); finger(m.shot, m.f);
    const d = META.mates1.marks.duel;
    ring(L >= 66 && L < 140 ? { x: 16, y: d.y - 28, w: 361, h: 188 } : null, prog(L, 66, 138), null, 2);
    return { s: 1 + (L < 140 ? .08 * eio(prog(L, 60, 80)) : .04 * prog(L, 140, 240)), fy: 40, bump: L >= 140 ? L - 140 : undefined, dipAt: 140 };
  },
  private(L) {
    only(null); const m = TL.map.private(L); film(m.shot, m.f); finger(m.shot, m.f);
    const r = META.private2.marks.row;
    ring(L >= 112 ? r : null, prog(L, 112, 158), null, 4);
    return { s: 1 + .05 * prog(L % 80, 0, 80), fy: 200, bump: L >= 80 ? L - 80 : undefined, dipAt: 80 };
  },
  looks(L) {
    only(null); const m = TL.map.looks(L); film(m.shot, m.f); $('finger').style.display = $('ripple').style.display = 'none';
    const i = Math.min(4, Math.floor(L / 40));
    return { s: 1.02, bump: L % 40, bg: TL.looks[i], from: i ? TL.looks[i - 1] : 'aurora', bgt: prog(L % 40, 0, 8), dark: TL.looks[i] === 'daysky', dipAt: i ? i * 40 : undefined, soft: true };
  },
  answer(L) {
    only('chat'); layers(null, null); drawChat(L, TL.answer, 'a', TL.chat.slice(2));
    return { s: lerp(1.0, 1.05, prog(L, 0, 160)), bg: 'aurora', from: 'daysky', bgt: prog(L, 0, 10) };
  },
  end(L) { only('chat'); drawChat(999, TL.answer, 'a', TL.chat.slice(2)); return { s: 1, out: eio(prog(L, 0, 16)) }; },
};

// ---- the end card
const NUGS = [['zkittlez', .15, .13, 300], ['lemon-popperz', .86, .11, 250], ['california-og', .12, .87, 260], ['watermelon-zkittlez', .87, .88, 280], ['peanut-butter', .5, .95, 190]];
const nugBox = $('nugs');
NUGS.forEach(([n]) => { const i = document.createElement('img'); i.className = 'nug'; i.src = `nugs/${n}.png`; nugBox.appendChild(i); });
function drawEnd(L) {
  const end = $('end');
  if (L < 0) { end.style.display = nugBox.style.display = 'none'; return; }
  end.style.display = 'flex'; nugBox.style.display = 'block';
  [...end.children].forEach((e, i) => {
    const p = prog(L, 10 + i * 5, 24 + i * 5);
    e.style.opacity = eo(p);
    e.style.transform = i === 0 ? `scale(${.4 + .6 * back(p)})` : `translateY(${(1 - eo(p)) * 40}px)` + (i === 4 ? ` scale(${1 + .025 * Math.sin(L / 9)})` : '');
  });
  [...nugBox.children].forEach((e, i) => {
    const [, x, y, size] = NUGS[i]; const p = back(prog(L, 14 + i * 4, 34 + i * 4));
    const sz = size * (V ? 1 : .86) * (V || i < 4 ? 1 : 0);
    const hx = V ? x : (i === 4 ? .5 : x < .5 ? x * .9 : 1 - (1 - x) * .9);
    e.style.width = sz + 'px'; e.style.left = W * hx - sz / 2 + 'px'; e.style.top = H * y - sz / 2 + 'px';
    e.style.opacity = clamp(p * 1.5);
    e.style.transform = `translate(${Math.sin(L / 30 + i * 1.7) * 14}px, ${Math.cos(L / 26 + i) * 18}px) rotate(${(i % 2 ? 1 : -1) * (8 + Math.sin(L / 40 + i) * 5)}deg) scale(${.5 + .5 * p})`;
  });
}

// ---- one frame
window.render = async (t) => {
  const F = Math.max(0, Math.min(TL.total - 1, Math.round(t * 30)));
  const id = TL.order.find((k) => F >= S[k].at && F < S[k].end);
  const sc = S[id], L = F - sc.at;
  ring(null, 0); $('fly').style.display = 'none'; $('snap').style.opacity = 1;
  if (!SC[id].length) {} // (every scene takes L)
  if (id !== 'rate' && id !== 'rank' && id !== 'strainz' && id !== 'sources' && id !== 'post' && id !== 'mates' && id !== 'private') { $('finger').style.display = $('ripple').style.display = 'none'; }
  const c = SC[id](L) || cam0;
  // the beat: a soft pulse while the drums play
  const drums = F >= S.snap.at && F < S.answer.at || F >= S.end.at;
  const pulse = drums ? Math.exp(-((F % BEAT) / BEAT) * 5) : 0;
  drawBg(F, c.from ?? c.bg ?? 'aurora', c.bg ?? 'aurora', c.bgt ?? 1, pulse);
  drawCap(F);
  // every new scene: the screen dips through dark, the phone gives a small bump and the glass catches the light
  const bump = c.bump ?? L;
  const cutL = c.bump ?? L;
  const toEnd = Math.min(sc.end - F, c.dipAt !== undefined && L < c.dipAt ? c.dipAt - L : 999);
  const soft = c.soft ? .5 : 1;
  $('shade').style.opacity = id === 'end' ? 0 : Math.max(F < 3 ? 0 : (cutL < 6 ? .62 * soft * (1 - eo((cutL + 1) / 6)) : 0), toEnd <= 3 ? .5 * soft * (4 - toEnd) / 3 : 0);
  const gl = prog(cutL, 0, 16);
  $('glare').style.opacity = gl > 0 && gl < 1 ? Math.sin(gl * Math.PI) : 0; $('glare').style.left = lerp(-200, 460, gl) + 'px';
  $('status').className = c.dark ? 'dark' : '';
  $('homebar').style.background = c.dark ? 'rgba(0,0,0,.45)' : 'rgba(255,255,255,.5)';
  const bs = F < 3 ? 1 : .965 + .035 * back(clamp((bump + 1) / 11));
  const float = Math.sin(F / 47) * 1.6, tilt = Math.cos(F / 61) * 1.1;
  // the phone arrives at the very start and leaves for the end card
  const inP = id === 'chat' ? eo(prog(L, -8, 14)) : 1;
  const out = c.out ?? 0;
  const s = (c.s ?? 1) * bs * K * (1 - out * .12);
  const fx = c.fx ?? 196.5, fy = c.fy ?? 0;
  const tx = PX + 196.5 * K - fx * s + (fx - 196.5) * K;       // zoom about (fx, fy): that point stays put
  const ty = PY + fy * K - fy * s + (1 - inP) * 220 + out * H * 1.1 + Math.sin(F / 38) * 5;
  $('rig').style.transform = `translate(${tx}px, ${ty}px) scale(${s}) perspective(2600px) rotateY(${float}deg) rotateX(${tilt * .6}deg)`;
  $('rig').style.opacity = inP;
  drawEnd(id === 'end' ? L : -1);
  await Promise.all(pending.splice(0));
};
</script>
</body>
